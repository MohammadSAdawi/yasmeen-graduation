<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graduation Party Invitation</title>
<meta name="description" content="You're invited to a graduation celebration!">
<meta property="og:title" content="You're invited to a graduation party 🎓">
<meta property="og:description" content="Join us in celebrating. Tap to open your invitation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --base:#e3c7d5;      /* main brand colour */
  --light:#f7ebf1;
  --lighter:#fdf6f9;
  --mid:#c99bb4;
  --deep:#8c4a6c;
  --plum:#4a2a3c;
  --gold:#b98a5e;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:'Montserrat',sans-serif;color:var(--plum);
  background:linear-gradient(135deg,var(--light),var(--base) 55%,var(--mid)) fixed;
  background-size:200% 200%;animation:bg 14s ease-in-out infinite alternate;
  overflow-x:hidden;
}
@keyframes bg{to{background-position:100% 100%}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* floating background shapes */
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters i{position:absolute;bottom:-60px;display:block;border-radius:50% 50% 50% 0;background:#ffffff66;
  animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}

/* Intro */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--lighter),var(--base));transition:opacity .9s,visibility .9s,transform .9s;cursor:pointer;padding:16px;text-align:center}
#intro.hide{opacity:0;visibility:hidden;transform:scale(1.15)}
.cap{font-size:5rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 12px #8c4a6c44)}
@keyframes float{50%{transform:translateY(-16px) rotate(-8deg)}}
#intro h1{font-family:'Great Vibes',cursive;font-size:clamp(2.6rem,10vw,4.4rem);color:var(--deep);margin:12px 0 6px;font-weight:400;
  animation:rise-in 1s both}
#intro p{letter-spacing:.3em;font-size:.75rem;text-transform:uppercase;color:var(--plum);opacity:.8;animation:rise-in 1s .3s both}
@keyframes rise-in{from{opacity:0;transform:translateY(20px)}}
.btn{display:inline-block;margin-top:28px;padding:14px 34px;border:1.5px solid var(--deep);color:var(--deep);
  border-radius:40px;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;animation:pulse 2s infinite,rise-in 1s .6s both}
@keyframes pulse{50%{box-shadow:0 0 0 12px #8c4a6c18}}

/* Card */
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:40px 16px 60px;opacity:0;transform:translateY(40px) scale(.96);transition:all 1.1s .3s}
main.show{opacity:1;transform:none}
.card{
  position:relative;padding:46px 26px 38px;text-align:center;border-radius:18px;
  background:linear-gradient(160deg,var(--lighter),var(--light));
  border:1px solid var(--mid);box-shadow:0 24px 60px #8c4a6c33,inset 0 0 0 8px var(--lighter),inset 0 0 0 9px var(--base);
  overflow:hidden;
}
.card::before{ /* sweeping shine */
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg);
  animation:sweep 6s ease-in-out 2s infinite;pointer-events:none}
@keyframes sweep{0%{left:-60%}35%,100%{left:140%}}
main.show .card>*{animation:rise-in .9s both}
main.show .card>*:nth-child(1){animation-delay:.6s}
main.show .card>*:nth-child(2){animation-delay:.8s}
main.show .card>*:nth-child(3){animation-delay:1s}
main.show .card>*:nth-child(4){animation-delay:1.15s}
main.show .card>*:nth-child(5){animation-delay:1.3s}
main.show .card>*:nth-child(6){animation-delay:1.45s}
main.show .card>*:nth-child(7){animation-delay:1.6s}
main.show .card>*:nth-child(8){animation-delay:1.75s}
main.show .card>*:nth-child(9){animation-delay:1.9s}
main.show .card>*:nth-child(10){animation-delay:2.05s}
main.show .card>*:nth-child(11){animation-delay:2.2s}
main.show .card>*:nth-child(12){animation-delay:2.35s}
main.show .card>*:nth-child(13){animation-delay:2.47s}
main.show .card>*:nth-child(14){animation-delay:2.59s}
main.show .card>*:nth-child(15){animation-delay:2.71s}
main.show .card>*:nth-child(16){animation-delay:2.83s}
.eyebrow{letter-spacing:.35em;font-size:.7rem;text-transform:uppercase;color:var(--deep)}
.hat{font-size:3.2rem;margin:10px 0 0;display:inline-block;cursor:pointer;transition:transform .5s;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.hat:hover{transform:rotate(-20deg) scale(1.25)}
h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(3rem,13vw,5rem);color:var(--deep);line-height:1.05;margin:6px 0 2px}
.sub{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-style:italic;opacity:.85}
.title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:.4em;text-transform:uppercase;font-weight:600;color:var(--gold);margin-top:16px}
.name{font-family:'Great Vibes',cursive;font-size:clamp(2.8rem,12vw,4.6rem);margin:0 0 4px;
  background:linear-gradient(90deg,var(--deep),var(--gold),#d9a7c2,var(--deep));-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:300% auto;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% center}}
.degree{font-family:'Cormorant Garamond',serif;font-size:1.2rem;letter-spacing:.08em}
.divider{margin:26px auto;width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--deep),transparent);position:relative}
.divider::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--lighter);padding:0 8px;color:var(--deep);font-size:.8rem;
  animation:spin 6s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.place{display:block;text-decoration:none;color:var(--plum);border:1.5px dashed var(--mid);border-radius:14px;padding:12px 16px;
  background:#ffffff80;transition:.25s;cursor:pointer}
.place .ptxt{border-bottom:2px solid var(--deep);padding-bottom:1px}
.place .pin{display:inline-block;margin-right:6px;animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.place .hint{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);opacity:1;margin-top:6px;font-weight:500}
.place:hover,.place:focus-visible{background:var(--deep);color:var(--lighter);border-style:solid;border-color:var(--deep);transform:translateY(-3px);box-shadow:0 10px 22px #8c4a6c44;outline:none}
.place:hover .hint,.place:focus-visible .hint{color:var(--lighter)}
.place:hover .ptxt,.place:focus-visible .ptxt{border-color:var(--lighter)}
.details{display:grid;gap:18px}
.label{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--deep)}
.value{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;margin-top:2px}
.value small{display:block;font-size:1rem;font-weight:400;opacity:.8}

/* Countdown */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 4px}
.unit{border:1px solid var(--mid);border-radius:12px;padding:14px 4px;background:var(--base);background:linear-gradient(160deg,#ffffff99,var(--base));
  transition:transform .3s,box-shadow .3s}
.unit:hover{transform:translateY(-4px);box-shadow:0 10px 20px #8c4a6c33}
.num{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,8vw,2.8rem);font-weight:600;color:var(--deep);line-height:1}
.num.tick{animation:tick .45s}
@keyframes tick{0%{transform:translateY(-40%) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.unit span{display:block;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;margin-top:6px;opacity:.75}
#party{display:none;font-family:'Great Vibes',cursive;font-size:2.6rem;color:var(--deep);animation:bob 2s ease-in-out infinite}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.actions a,.actions button{font:inherit;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  padding:12px 22px;border-radius:30px;border:1.5px solid var(--deep);color:var(--deep);background:transparent;transition:.25s}
.actions .primary{background:var(--deep);color:var(--lighter);font-weight:500}
.actions a:hover,.actions button:hover{background:var(--deep);color:var(--lighter);transform:translateY(-3px);box-shadow:0 8px 18px #8c4a6c44}
.note{margin-top:22px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;opacity:.9}
#map{margin-top:18px;border:0;width:100%;height:240px;border-radius:12px;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="floaters" id="floaters"></div>
<canvas id="confetti"></canvas>

<div id="intro" role="button" tabindex="0" aria-label="Open invitation">
  <div class="cap">🎓</div>
  <h1>You're Invited</h1>
  <p>A graduation celebration</p>
  <div class="btn">Open Invitation</div>
</div>

<main id="main">
  <section class="card">
    <div class="eyebrow">Please join us to celebrate</div>
    <div class="hat" id="hat" title="Toss the cap!">🎓</div>
    <h2>Graduation Party</h2>
    <div class="sub">in honor of the graduate</div>
    <div class="title">The Pharmacist</div>
    <div class="name" id="name"></div>
    <div class="degree" id="degree"></div>

    <div class="divider"></div>

    <div class="details">
      <div><div class="label">When</div>
        <div class="value" id="when"></div></div>
      <div><div class="label">Where</div>
        <a class="value place" id="where" target="_blank" rel="noopener"></a></div>
    </div>

    <div class="divider"></div>

    <div class="label" style="margin-bottom:12px" id="cdlabel">The celebration begins in</div>
    <div class="count" id="count">
      <div class="unit"><div class="num" id="d">0</div><span>Days</span></div>
      <div class="unit"><div class="num" id="h">0</div><span>Hours</span></div>
      <div class="unit"><div class="num" id="m">0</div><span>Minutes</span></div>
      <div class="unit"><div class="num" id="s">0</div><span>Seconds</span></div>
    </div>
    <div id="party">It's party time! 🎉</div>

    <iframe id="map" loading="lazy" title="Map" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <div class="actions">
      <a class="primary" id="dir" target="_blank" rel="noopener">Get Directions</a>
      <a id="rsvp" target="_blank" rel="noopener">RSVP</a>
      <button id="fx">🎉 Celebrate</button>
    </div>
    <div class="note" id="note"></div>
  </section>
</main>

<script>
/* ============ EDIT THESE DETAILS ============ */
const CONFIG = {
  name: "Yasmeen",                 // her name
  degree: "Class of 2026",               // e.g. "Bachelor of Science in Nursing"
  // Local time of the event, format: YYYY-MM-DDTHH:MM:SS
  start: "2026-10-23T20:00:00+03:00",   // 8 PM Amman time
  durationHours: 2,
  dateText: "",                          // leave "" to auto-format from start
  placeName: "Zarqa, Jordan",
  address: "",
  mapLink: "https://maps.app.goo.gl/58cVsYkvRon6kXWi9",
  mapQuery: "",                          // leave "" to use the address
  rsvpWhatsApp: "",                      // digits only with country code, e.g. "15551234567"
  note: "Your presence is the greatest gift. Come share this special moment with us!"
};
/* ============================================ */

const $=id=>document.getElementById(id);
const start=new Date(CONFIG.start), end=new Date(start.getTime()+CONFIG.durationHours*36e5);
$('name').textContent=CONFIG.name;
$('degree').textContent=CONFIG.degree;
$('when').innerHTML=(CONFIG.dateText||start.toLocaleDateString('en-GB',{timeZone:'Asia/Amman',weekday:'long',month:'long',day:'numeric',year:'numeric'}))
  +'<small>'+start.toLocaleTimeString('en-US',{timeZone:'Asia/Amman',hour:'numeric',minute:'2-digit'})+' – '+end.toLocaleTimeString('en-US',{timeZone:'Asia/Amman',hour:'numeric',minute:'2-digit'})+' (Amman time)</small>';
$('where').href=CONFIG.mapLink||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(CONFIG.placeName));
$('where').innerHTML='<span class="pin">📍</span><span class="ptxt">'+CONFIG.placeName+'</span><small class="hint">Tap to open in Google Maps ↗</small>';
$('note').textContent=CONFIG.note;
document.title=CONFIG.name+" – Graduation Party";

const q=encodeURIComponent(CONFIG.mapQuery||CONFIG.address||CONFIG.placeName);
$('dir').href=CONFIG.mapLink||'https://www.google.com/maps/dir/?api=1&destination='+q;
if(!CONFIG.mapLink && CONFIG.address){
  const f=$('map');f.src='https://maps.google.com/maps?q='+q+'&output=embed';f.style.display='block';
}
if(CONFIG.rsvpWhatsApp){
  $('rsvp').href='https://wa.me/'+CONFIG.rsvpWhatsApp+'?text='+encodeURIComponent("Hi! I'll be at "+CONFIG.name+"'s graduation party 🎓");
}else $('rsvp').style.display='none';

/* Countdown */
let prev={};
function setNum(id,v){
  const el=$(id),t=String(v).padStart(2,'0');
  if(prev[id]!==t){el.textContent=t;el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');prev[id]=t}
}
function update(){
  let diff=start-new Date();
  if(diff<=0){$('count').style.display='none';$('cdlabel').style.display='none';$('party').style.display='block';return}
  setNum('d',Math.floor(diff/864e5));
  setNum('h',Math.floor(diff/36e5)%24);
  setNum('m',Math.floor(diff/6e4)%60);
  setNum('s',Math.floor(diff/1e3)%60);
}
update();setInterval(update,1000);

/* Confetti */
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(n=140){
  const cols=['#e3c7d5','#8c4a6c','#b98a5e','#ffffff','#f2a7c6','#c99bb4'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,
    w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
  if(!run){run=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-p.life/160);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.life<160&&p.y<cv.height+40);
  if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
$('fx').onclick=()=>burst();
$('hat').onclick=()=>burst(80);

/* Floating hearts/petals */
(function(){const f=$('floaters');
  for(let i=0;i<22;i++){const e=document.createElement('i'),z=8+Math.random()*18;
    e.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(10+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';
    f.appendChild(e)}})();

/* Open intro */
function open(){
  $('intro').classList.add('hide');$('main').classList.add('show');
  setTimeout(()=>burst(180),500);
}
$('intro').onclick=open;
$('intro').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')open()};
</script>
</body>
</html>
